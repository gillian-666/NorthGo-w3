  <style>
    :root {
      --navy: #062445;
      --navy-deep: #04182f;
      --cyan: #2ad4e8;
      --cyan-dim: rgba(42, 212, 232, 0.16);
      --text: #f4fbff;
      --muted: #b7c9d8;
      --card: rgba(255, 255, 255, 0.06);
      --line: rgba(42, 212, 232, 0.28);
      --warn: #f4c95d;
      --ok: #6ee7b7;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Hiragino Sans", sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 500px at 10% -10%, rgba(42, 212, 232, 0.18), transparent 50%),
        linear-gradient(180deg, var(--navy-deep), var(--navy) 32%, #08305a);
      min-height: 100vh;
      line-height: 1.55;
    }

    a { color: var(--cyan); text-decoration: none; }
    a:hover, a:focus-visible { text-decoration: underline; outline: none; }

    .wrap { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }
    header.hero { padding: 28px 0 8px; }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .brand-logo {
      height: 28px;
      width: auto;
      display: block;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .lang-switch {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.18);
    }

    .lang-switch button {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 8px 12px;
      border-radius: 999px;
      cursor: pointer;
      font: inherit;
      font-size: 0.88rem;
    }

    .lang-switch button[aria-pressed="true"] {
      background: var(--cyan-dim);
      color: var(--cyan);
      font-weight: 700;
    }

    .lang-switch button:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 2px;
    }

    .alt-link {
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 0.88rem;
    }

    nav.jump { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
    nav.jump a {
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 0.92rem;
      text-decoration: none;
    }
    nav.jump a:hover, nav.jump a:focus-visible { background: var(--cyan-dim); }

    h1 {
      font-size: clamp(2rem, 5vw, 3.4rem);
      line-height: 1.12;
      margin: 28px 0 12px;
    }
    h1 span { color: var(--cyan); }
    .lede { max-width: 70ch; color: var(--muted); font-size: 1.05rem; }

    .meta {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin: 28px 0 8px;
    }
    .stat {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px 18px;
      box-shadow: var(--shadow);
    }
    .stat b { display: block; font-size: 1.6rem; color: var(--cyan); }
    .stat span { color: var(--muted); font-size: 0.92rem; }

    .note {
      margin: 18px 0 0;
      padding: 14px 16px;
      border-left: 3px solid var(--warn);
      background: rgba(244, 201, 93, 0.08);
      border-radius: 0 12px 12px 0;
      color: #f8e7b8;
      font-size: 0.95rem;
    }

    section { padding: 28px 0; }
    h2 { font-size: clamp(1.4rem, 3vw, 1.9rem); margin: 0 0 16px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    article.card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }
    article.card h3 { margin: 0 0 8px; font-size: 1.15rem; }

    .path {
      display: inline-block;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.82rem;
      color: var(--muted);
      background: rgba(0, 0, 0, 0.22);
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 10px;
      word-break: break-all;
    }

    ul.tree { margin: 10px 0 0; padding: 0 0 0 18px; }
    ul.tree li { margin: 6px 0; }

    .tag {
      display: inline-block;
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 999px;
      margin-left: 6px;
      vertical-align: middle;
    }
    .tag.live { background: rgba(110, 231, 183, 0.16); color: var(--ok); }
    .tag.anchor { background: var(--cyan-dim); color: var(--cyan); }
    .tag.missing { background: rgba(244, 201, 93, 0.16); color: var(--warn); }

    .offices {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }
    .office {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
    }
    .office h4 { margin: 0 0 6px; }
    .office p { margin: 0; color: var(--muted); font-size: 0.92rem; }

    .flow { overflow-x: auto; padding-bottom: 8px; -webkit-overflow-scrolling: touch; }
    .flow svg { width: 100%; min-width: 760px; height: auto; }

    footer {
      padding: 24px 0 40px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      margin-top: 8px;
    }

    @media (max-width: 900px) {
      .meta { grid-template-columns: repeat(2, 1fr); }
      .grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      .wrap { width: min(1180px, calc(100% - 20px)); }
      .meta { grid-template-columns: 1fr; }
      nav.jump a, .alt-link { width: 100%; text-align: center; }
      .lang-switch { width: 100%; justify-content: stretch; }
      .lang-switch button { flex: 1 1 auto; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
  </style>
</head>

    const PREFIX = { en: "", "zh-tw": "/zh-tw", ja: "/ja", vi: "/vi" };

    function path(lang, p) {
      const pre = PREFIX[lang] || "";
      if (!p || p === "/") return pre || "/";
      return pre + p;
    }

    function abs(lang, p, hash) {
      const full = path(lang, p);
      return BASE + (full === "/" ? "/" : full) + (hash || "");
    }

    function applyStatic(t) {
      document.documentElement.lang = t.htmlLang;
      document.title = t.brand + " | Sitemap";
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.getAttribute("data-i18n");
        if (t[key] != null) el.textContent = t[key];
      });
      document.querySelectorAll("[data-i18n-html]").forEach((el) => {
        const key = el.getAttribute("data-i18n-html");
        if (t[key] != null) el.innerHTML = t[key];
      });
      const q = new URLSearchParams(location.search);
      q.set("lang", currentLang);
      const tree = document.querySelector('a[data-i18n="treeLink"]');
      if (tree) tree.href = "sitemap-tree.html?" + q.toString();
      const mapLink = document.querySelector('a[data-i18n="mapLink"]');
      if (mapLink) mapLink.href = "locations-map.html";
    }

    function renderDiagram(lang, t) {

              <stop offset="1" stop-color="#7ee8f4"/>

          <text x="550" y="48" text-anchor="middle" fill="#f4fbff" font-size="18" font-family="Segoe UI, sans-serif">${L.home} ${path(lang, "/")}</text>
          <line x1="550" y1="68" x2="550" y2="104" stroke="#2ad4e8" stroke-width="2"/>
          <line x1="80" y1="104" x2="1020" y2="104" stroke="#2ad4e8" stroke-width="2"/>
          <g font-family="Segoe UI, sans-serif" font-size="13" fill="#f4fbff" text-anchor="middle">

            <rect x="500" y="124" width="140" height="44" rx="12" fill="#0b335c" stroke="#2ad4e8"/><text x="570" y="151">${ia[3]}</text>
            <rect x="660" y="124" width="140" height="44" rx="12" fill="#0b335c" stroke="#f4c95d"/><text x="730" y="151">${ia[4]}</text>
            <rect x="820" y="124" width="140" height="44" rx="12" fill="#0b335c" stroke="#2ad4e8"/><text x="890" y="151">${ia[5]}</text>
            <rect x="980" y="124" width="100" height="44" rx="12" fill="#0b335c" stroke="#2ad4e8"/><text x="1030" y="151">${ia[6]}</text>
          </g>
          <g stroke="#2ad4e8" stroke-width="2" fill="none">
            <path d="M250 168 V198 H90"/><path d="M250 198 H410"/><path d="M250 198 H570"/><path d="M250 198 H730"/>
            <path d="M890 168 V250"/><path d="M1030 168 V250"/>
          </g>
          <g font-family="Segoe UI, sans-serif" font-size="12" fill="#b7c9d8" text-anchor="middle">
            <rect x="20" y="214" width="140" height="36" rx="10" fill="#062445" stroke="#2ad4e8"/><text x="90" y="237">${L.freight}</text>
            <rect x="180" y="214" width="140" height="36" rx="10" fill="#062445" stroke="#2ad4e8"/><text x="250" y="237">${L.project}</text>

            <rect x="980" y="338" width="100" height="30" rx="8" fill="#062445" stroke="#2ad4e8"/><text x="1030" y="358">JA</text>

          </g>
        </svg>`;
    }

    function card(title, pathText, body, linksHtml, tagClass, tagText) {
      return `<article class="card">
        <h3>${title} <span class="tag ${tagClass}">${tagText}</span></h3>
        <span class="path">${pathText}</span>
        <p>${body}</p>
        <ul class="tree">${linksHtml}</ul>
      </article>`;
    }

    function renderPages(lang, t) {
      const L = t.labels;
      const D = t.desc;
      const grid = document.getElementById("pages-grid");
      grid.innerHTML = [
        card(L.home, path(lang, "/"), D.home, `
          <li><a href="${abs(lang, "/")}" target="_blank" rel="noopener">${abs(lang, "/")}</a></li>
          <li>${L.why} <a href="${abs(lang, "/", "#why-northgo")}" target="_blank" rel="noopener">${path(lang, "/")}#why-northgo</a> <span class="tag anchor">${t.anchor}</span></li>
          <li>${L.enquire} → <a href="${abs(lang, "/contact", "#enquiry-form")}" target="_blank" rel="noopener">${path(lang, "/contact")}#enquiry-form</a></li>
        `, "live", t.live),
        card(L.about, path(lang, "/about"), D.about, `
          <li><a href="${abs(lang, "/about")}" target="_blank" rel="noopener">${abs(lang, "/about")}</a></li>
        `, "live", t.live),
        card(L.freight, path(lang, "/services/freight-logistics"), D.freight, `
          <li><a href="${abs(lang, "/services/freight-logistics")}" target="_blank" rel="noopener">${L.freight}</a></li>
          <li>${L.ocean} <span class="tag anchor">${t.inpage}</span></li>
          <li>${L.air} <span class="tag anchor">${t.inpage}</span></li>
          <li>${L.land} <span class="tag anchor">${t.inpage}</span></li>
          <li>${L.customs} <span class="tag anchor">${t.inpage}</span></li>
        `, "live", t.live),
        card(L.project, path(lang, "/services/project-logistics"), D.project, `
          <li><a href="${abs(lang, "/services/project-logistics")}" target="_blank" rel="noopener">${L.project}</a></li>
        `, "live", t.live),
        card(L.warehouse, path(lang, "/services/warehouse-logistics"), D.warehouse, `
          <li><a href="${abs(lang, "/services/warehouse-logistics")}" target="_blank" rel="noopener">${L.warehouse}</a></li>
        `, "live", t.live),
        card(L.shipping, path(lang, "/services/shipping-agency"), D.shipping, `
          <li><a href="${abs(lang, "/services/shipping-agency")}" target="_blank" rel="noopener">${L.shipping}</a></li>
        `, "live", t.live),
        card(`${L.contact} / ${L.locations}`, path(lang, "/contact"), D.contact, `
          <li><a href="${abs(lang, "/contact")}" target="_blank" rel="noopener">${abs(lang, "/contact")}</a></li>
          <li>${L.enquire} <a href="${abs(lang, "/contact", "#enquiry-form")}" target="_blank" rel="noopener">#enquiry-form</a> <span class="tag anchor">${t.anchor}</span></li>
        `, "live", t.live),
        card(L.news, path(lang, "/news"), D.news, "", "missing", t.missing),
        card(L.legal, path(lang, "/legal") + "/*", D.legal, `
          <li><a href="${abs(lang, "/legal/privacy-policy")}" target="_blank" rel="noopener">${L.privacy}</a></li>
          <li><a href="${abs(lang, "/legal/terms")}" target="_blank" rel="noopener">${L.terms}</a></li>
          <li><a href="${abs(lang, "/legal/cookie-policy")}" target="_blank" rel="noopener">${L.cookie}</a></li>
          <li><a href="${abs(lang, "/legal/disclaimer")}" target="_blank" rel="noopener">${L.disclaimer}</a></li>
        `, "live", t.live),
        card(L.external, "—", D.external, `
          <li>Strategy Creative</li>
          <li>Facebook / Instagram / Twitter → <code>#</code></li>
        `, "live", t.live)
      ].join("");
    }

    function renderOffices(t) {
      document.getElementById("offices-grid").innerHTML = t.offices.map((o) => `
        <div class="office"><h4>${o.name}</h4><p>${o.detail}</p></div>
      `).join("");
    }

    let currentLang = "zh-tw";

    function setLang(lang) {
      if (!I18N[lang]) lang = "zh-tw";
      currentLang = lang;
      const t = I18N[lang];
      document.querySelectorAll(".lang-switch button").forEach((btn) => {
        btn.setAttribute("aria-pressed", String(btn.dataset.lang === lang));
      });
      const url = new URL(location.href);
      url.searchParams.set("lang", lang);
      history.replaceState(null, "", url);
      applyStatic(t);
      renderDiagram(lang, t);
      renderPages(lang, t);
      renderOffices(t);
      document.getElementById("site-home").href = abs(lang, "/");
    }

    document.querySelectorAll(".lang-switch button").forEach((btn) => {
      btn.addEventListener("click", () => setLang(btn.dataset.lang));
    });

    const initial = new URLSearchParams(location.search).get("lang") || "zh-tw";
    setLang(initial);

    fetch("BUMP")
      .then((r) => r.text())
      .then((v) => {
        document.querySelectorAll("[data-version]").forEach((el) => {
          el.textContent = "v" + v.trim();
        });
      })
      .catch(() => {});
  </script>
