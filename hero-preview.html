<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Northgo Hero Preview | Logo &amp; Globe</title>
  <meta name="description" content="Northgo Logo 與淺藍色海洋地球儀 Hero 預覽。" />
  <meta name="northgo-bump" content="20261112.1" />
  <link rel="icon" href="brand/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="brand/webclip.jpg" />
  <style>
    :root {
      --navy: #062445;
      --navy-deep: #04182f;
      --navy-mid: #0a3a66;
      --cyan: #2ad4e8;
      --text: #f4fbff;
      --muted: #b7c9d8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      color: var(--text);
      background: var(--navy-deep);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.85rem 1.25rem;
      background: rgba(4, 24, 47, 0.9);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
    }

    header img {
      height: 28px;
      width: auto;
      display: block;
    }

    header a {
      color: var(--cyan);
      text-decoration: none;
      font-size: 0.9rem;
    }

    .hero {
      position: relative;
      min-height: 78vh;
      overflow: hidden;
      background:
        linear-gradient(
          115deg,
          rgba(4, 24, 47, 0.92) 0%,
          rgba(6, 36, 69, 0.78) 42%,
          rgba(6, 36, 69, 0.35) 100%
        ),
        radial-gradient(900px 420px at 85% 10%, rgba(42, 212, 232, 0.16), transparent 50%),
        url("brand/globe-light-ocean.jpg") right center / cover no-repeat,
        linear-gradient(165deg, var(--navy-deep) 0%, var(--navy) 48%, var(--navy-mid) 100%);
    }

    .hero-inner {
      position: relative;
      z-index: 1;
      width: min(1180px, calc(100% - 2rem));
      margin: 0 auto;
      min-height: 78vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 5rem 0 4rem;
    }

    .eyebrow {
      margin: 0;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--cyan);
    }

    h1 {
      margin: 1rem 0 0;
      max-width: 16ch;
      font-size: clamp(2.6rem, 7vw, 4.5rem);
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    h1 span { color: var(--cyan); }

    .lead {
      margin: 1.25rem 0 0;
      max-width: 34rem;
      font-size: 1.1rem;
      line-height: 1.6;
      color: rgba(244, 251, 255, 0.8);
    }

    .actions {
      margin-top: 1.75rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .actions a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.8rem 1.35rem;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
    }

    .actions .primary {
      background: var(--cyan);
      color: var(--navy-deep);
    }

    .actions .ghost {
      border: 1px solid var(--cyan);
      color: var(--cyan);
    }

    .panel {
      width: min(1180px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2.5rem 0 3rem;
    }

    .panel h2 {
      margin: 0 0 0.75rem;
      font-size: 1.35rem;
    }

    .panel p {
      margin: 0 0 1.25rem;
      color: var(--muted);
      line-height: 1.6;
    }

    .assets {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }

    .card {
      border: 1px solid rgba(42, 212, 232, 0.28);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.04);
      padding: 1rem;
    }

    .card strong {
      display: block;
      margin-bottom: 0.75rem;
      color: var(--cyan);
      font-size: 0.85rem;
    }

    .card img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 10px;
      background: #03101f;
    }

    .card.logo-card {
      display: grid;
      place-items: center;
      min-height: 140px;
    }

    .card.logo-card img {
      width: min(220px, 100%);
      background: transparent;
    }

    footer {
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 1rem 1.25rem 1.5rem;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
    }

    footer a { color: var(--cyan); }
  </style>
</head>
<body>
  <header>
    <a href="index.html" aria-label="Northgo">
      <img src="brand/logo-teal-blue.svg" alt="Northgo" width="160" height="31" />
    </a>
    <a href="index.html">← 原型入口</a>
  </header>

  <section class="hero" aria-label="Earth globe background">
    <div class="hero-inner">
      <p class="eyebrow">Northgo</p>
      <h1>Making logistics <span>effortless.</span></h1>
      <p class="lead">
        Logo 與淺藍色海洋地球儀背景預覽——對應 northgo-web 首頁 Hero 成果。
      </p>
      <div class="actions">
        <a class="primary" href="locations-map.html">據點地圖</a>
        <a class="ghost" href="sitemap.html">網站地圖</a>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>已同步資產</h2>
    <p>以下檔案已放到 GitHub，並經 GitHub Pages 公開。</p>
    <div class="assets">
      <div class="card logo-card">
        <strong>Logo（Teal Blue）</strong>
        <img src="brand/logo-teal-blue.svg" alt="Northgo logo teal blue" />
      </div>
      <div class="card logo-card" style="background:#062445;">
        <strong>Logo（Teal White）</strong>
        <img src="brand/logo-teal-white.svg" alt="Northgo logo teal white" />
      </div>
      <div class="card">
        <strong>地球儀（淺藍色海洋）</strong>
        <img src="brand/globe-light-ocean.jpg" alt="Globe with light blue oceans" />
      </div>
    </div>
  </section>

  <footer>
    bump 20261112.1 ·
    <a href="https://github.com/gillian-666/NorthGo-w3" target="_blank" rel="noopener">GitHub repo</a>
  </footer>
</body>
</html>
