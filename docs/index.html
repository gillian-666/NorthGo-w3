<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NorthGo-w3 | Prototypes</title>
  <meta name="description" content="Northgo 靜態原型：網站地圖與全球據點地圖。" />
  <meta name="northgo-bump" content="20261111.2" />
  <link rel="icon" href="brand/favicon.png" type="image/png" />
  <style>
    :root {
      --navy: #062445;
      --navy-deep: #04182f;
      --cyan: #2ad4e8;
      --text: #f4fbff;
      --muted: #b7c9d8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 420px at 10% -10%, rgba(42, 212, 232, 0.16), transparent 50%),
        linear-gradient(180deg, var(--navy-deep), var(--navy));
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    main { max-width: 36rem; width: 100%; }
    h1 { margin: 0 0 0.5rem; font-size: 1.75rem; letter-spacing: 0.02em; }
    p { margin: 0 0 1.5rem; color: var(--muted); line-height: 1.6; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.75rem; }
    a {
      display: block;
      padding: 1rem 1.15rem;
      border: 1px solid rgba(42, 212, 232, 0.28);
      border-radius: 14px;
      color: var(--cyan);
      text-decoration: none;
      background: rgba(255, 255, 255, 0.05);
    }
    a:hover, a:focus-visible {
      background: rgba(42, 212, 232, 0.12);
      outline: none;
    }
    .bump { margin-top: 1.25rem; font-size: 0.8rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>NorthGo-w3</h1>
    <p>靜態原型入口。正式行銷站請見 northgo-web（Vercel）。</p>
    <ul>
      <li><a href="sitemap.html">網站地圖 Sitemap</a></li>
      <li><a href="sitemap-tree.html">樹狀網站地圖</a></li>
      <li><a href="locations-map.html">全球據點地圖</a></li>
    </ul>
    <p class="bump">bump 20261111.2</p>
  </main>
</body>
</html>
